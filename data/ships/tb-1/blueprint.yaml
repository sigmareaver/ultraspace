schema: ship/1
id: tb-1
name: "TB-1 Breadboard"
# Minimal test-fixture vessel (testing.md). Grows very reluctantly.
# Topology: BAT1 -> contactor -> BUS E -> (tie + precharge) -> BUS A,
# one breaker-fed load per bus. All switches start OPEN at cold & dark.
# M2 (ata-42-data.md §2): one data bus DB-A — BC on essential feed CB E2,
# RT 12 on CB A2, RT 5 on CB E3; two RTs make the one-dark vs all-dark
# diagnostic split decidable.

nodes:
  - {id: bat1.term, c_f: 0.0002}
  - {id: bus.e, c_f: 0.008, bus: true}
  - {id: bus.a, c_f: 0.012, bus: true}
  - {id: load.avionics.in, c_f: 0.0001}
  - {id: load.cabin.in, c_f: 0.0001}
  - {id: load.bc.in, c_f: 0.0001}
  - {id: load.rt12.in, c_f: 0.0001}
  - {id: load.rt5.in, c_f: 0.0001}

data_buses:
  - {id: db.a, name: DB-A}

devices:
  - id: bat1
    part: core:bat-28-40
    ports: {pos: bat1.term, neg: gnd}
    params: {soc_init: 0.75}   # EMF = 22.0 + 6.4*0.75 = 26.8 V
  - id: ctr.bat1
    part: core:ctr-30b   # energization-rated; a plain ctr-30 here trips on closure
    ports: {a: bat1.term, b: bus.e}
    scl: eps.bat.1.contactor
  - id: tie.a
    part: core:ctr-30
    ports: {a: bus.e, b: bus.a}
    scl: eps.bus.a.tie
  - id: pcu.a
    part: core:pcu-50
    ports: {a: bus.e, b: bus.a}
    scl: eps.bus.a.precharge
    interlock_open: tie.a      # SOM 24-30-01 note 2
  - id: cb.e1
    part: core:cb-5
    ports: {a: bus.e, b: load.avionics.in}
    scl: eps.cb.e1
  - id: load.avionics
    part: core:load-60w
    ports: {pos: load.avionics.in, neg: gnd}
  - id: cb.a1
    part: core:cb-10
    ports: {a: bus.a, b: load.cabin.in}
    scl: eps.cb.a1
  - id: load.cabin
    part: core:load-150w
    ports: {pos: load.cabin.in, neg: gnd}
  - id: cb.e2
    part: core:cb-5
    ports: {a: bus.e, b: load.bc.in}
    scl: eps.cb.e2
  - id: bc.a
    part: core:bc-1553
    ports: {pos: load.bc.in, neg: gnd}
    data_bus: db.a
    scl: data.db.a
  - id: cb.a2
    part: core:cb-5
    ports: {a: bus.a, b: load.rt12.in}
    scl: eps.cb.a2
  - id: rt.12
    part: core:rt-1553
    ports: {pos: load.rt12.in, neg: gnd}
    data_bus: db.a
    scl: data.db.a.rt.12
    params: {rt_address: 12}
  - id: cb.e3
    part: core:cb-5
    ports: {a: bus.e, b: load.rt5.in}
    scl: eps.cb.e3
  - id: rt.5
    part: core:rt-1553
    ports: {pos: load.rt5.in, neg: gnd}
    data_bus: db.a
    scl: data.db.a.rt.5
    params: {rt_address: 5}
  # DB-A harness (ata-42-data.md §2): bc.a — j1 — j2, RT 5 at j1, RT 12 at j2.
  - id: j1
    part: core:db-coupler
    data_bus: db.a
    scl: data.db.a.j1
  - id: j2
    part: core:db-coupler
    data_bus: db.a
    scl: data.db.a.j2
  - id: seg.bc-j1
    part: core:db-harness
    data_bus: db.a
    ends: {a: bc.a, b: j1}
    scl: data.db.a.seg.bc-j1
  - id: seg.j1-j2
    part: core:db-harness
    data_bus: db.a
    ends: {a: j1, b: j2}
    scl: data.db.a.seg.j1-j2
  - id: stub.j1-rt5
    part: core:db-harness
    data_bus: db.a
    ends: {a: j1, b: rt.5}
    scl: data.db.a.stub.j1-rt5
  - id: stub.j2-rt12
    part: core:db-harness
    data_bus: db.a
    ends: {a: j2, b: rt.12}
    scl: data.db.a.stub.j2-rt12
  - id: mt.bus.e.v
    part: core:xducer-v
    measures: bus.e
    scl: eps.bus.e
  - id: mt.bus.a.v
    part: core:xducer-v
    measures: bus.a
    scl: eps.bus.a
  - id: mt.bat.1.i
    part: core:xducer-i
    measures: ctr.bat1
    scl: eps.bat.1
  - id: mt.bat.1.soc
    part: core:xducer-soc
    measures: bat1
    scl: eps.bat.1

  # Remote current transducers (ata-42-data.md §4): sited at their loads and
  # reported through the terminal in that bay, so a dark RT sends the reading
  # stale while the load itself keeps drawing. The bus and battery instruments
  # stay panel-wired — SOM 24-30-01 step 2 reads BUS E with the ship dark.
  - id: mt.load.cabin.i
    part: core:xducer-i
    measures: load.cabin
    carried_by: rt.12
    scl: eps.load.cabin
  - id: mt.load.avionics.i
    part: core:xducer-i
    measures: load.avionics
    carried_by: rt.5
    scl: eps.load.avionics

  # The SEU environment monitor (ata-42-data.md §2): panel-wired on purpose —
  # the instrument that watches what breaks the terminals cannot be behind a
  # terminal. Reads its own face in p/cm2s; the sim keeps flux in SI.
  - id: mt.seu.flux
    part: core:xducer-seu
    scl: data.seu

annunciators:
  - id: ann.bus.e.uv
    telemetry: mt.bus.e.v
    message: "BUS E UNDERVOLT"
    severity: warning        # the essential bus: nothing downstream survives it
    low: 24.0
    arm_above: 25.0   # quiet while cold & dark; arms once the bus first comes up
  - id: ann.bus.a.uv
    telemetry: mt.bus.a.v
    message: "BUS A UNDERVOLT"
    severity: caution        # non-essential distribution: real, and you have time
    low: 24.0
    arm_above: 25.0
  - id: ann.db.a.degraded
    telemetry: bc.a          # BC health fraction (silent while BC dark)
    message: "DATA BUS A DEGRADED"
    severity: caution
    low: 1.0                 # fires when any RT is declared FAILED
  # Graded annunciation (ata-31-indicating.md §4): DEGRADED cannot fire twice,
  # so the loss of the *last* terminal needs its own lamp at its own level —
  # the 2026-09-13 playtest finding, in content.
  - id: ann.db.a.failed
    telemetry: bc.a
    message: "DATA BUS A FAILED"
    severity: warning
    low: 0.01                # fires when no terminal answers at all
  - id: ann.seu.hazard
    telemetry: mt.seu.flux     # ambient particle flux, p/cm2s
    message: "SEU HAZARD"
    severity: caution          # act soon: shed what you can before it breaks something
    high: 100.0                # no arm gate: a high reading is never spurious

# Ship's stores (failure-and-repair.md, MAINT v1). Finite, and small: one
# spare terminal is what a two-terminal ship carries, which means the second
# latch-up of a voyage is a decision and not a formality. Serials are derived
# (<P/N>/<NNNN>, continuing after the fitted units), so stocking a part costs
# no authoring beyond this line.
spares:
  - part: core:rt-1553
    qty: 1
