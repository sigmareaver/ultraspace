schema: scenario/1
id: spe-minor
name: "Minor particle event"
ship: core:tb-1
seed: 24
# The common case, and the one the checklist is actually written for: a small
# event that crosses the limit, stays up for a few minutes and goes away. The
# trade in SOM 42-30-02 is cheap here — shed one terminal, wait, restore it —
# and the kept terminal usually survives. Usually. At 250 p/cm2s the essential
# terminal still runs a few percent chance of latching up over the passage,
# which is the point: the procedure reduces exposure, it does not remove it.
environment:
  - {at_s: 0.0,   flux_cm2s: 0.1}
  - {at_s: 60.0,  flux_cm2s: 0.1}
  - {at_s: 120.0, flux_cm2s: 250.0}
  - {at_s: 240.0, flux_cm2s: 250.0}
  - {at_s: 360.0, flux_cm2s: 0.1}
